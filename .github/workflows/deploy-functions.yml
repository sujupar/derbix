name: Deploy Supabase Functions

# Despliega las Edge Functions de Supabase automáticamente.
# - En push a main: despliega SOLO las funciones que cambiaron en ese push.
# - Manual (workflow_dispatch): despliega la(s) función(es) que indiques.
# El frontend NO se toca aquí — eso lo despliega Netlify.
#
# REQUISITO: agregar el secreto SUPABASE_ACCESS_TOKEN en
# GitHub → Settings → Secrets and variables → Actions → New repository secret.
# Genera el token en https://supabase.com/dashboard/account/tokens

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Funciones a desplegar (separadas por espacio). Vacío = daily-analysis-generator'
        required: false
        default: 'daily-analysis-generator'

env:
  SUPABASE_PROJECT_REF: nokejmhlpsaoerhddcyc

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determinar funciones a desplegar
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FNS="${{ github.event.inputs.functions }}"
            [ -z "$FNS" ] && FNS="daily-analysis-generator"
          else
            BEFORE='${{ github.event.before }}'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE_ARGS="HEAD~1 HEAD"
            else
              RANGE_ARGS="$BEFORE ${{ github.sha }}"
            fi
            FNS=$(git diff --name-only $RANGE_ARGS -- supabase/functions/ \
              | sed -nE 's#^supabase/functions/([^/]+)/.*#\1#p' \
              | grep -v '^_shared$' \
              | sort -u \
              | tr '\n' ' ')
          fi
          echo "functions=$FNS" >> "$GITHUB_OUTPUT"
          echo "Funciones a desplegar: ${FNS:-(ninguna)}"

      - name: Deploy
        if: steps.pick.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN. Agrégalo en Settings → Secrets → Actions."
            exit 1
          fi
          for fn in ${{ steps.pick.outputs.functions }}; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "::group::Deploy $fn"
              supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --no-verify-jwt
              echo "::endgroup::"
            else
              echo "Saltando '$fn' — no existe supabase/functions/$fn"
            fi
          done
